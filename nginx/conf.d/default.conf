server {
    listen 80;
    server_name localhost; # Замените на ваш домен в продакшене

    # Путь к статике внутри контейнера nginx должен совпадать с volume в docker-compose
    location /static/ {
        alias /home/app/django_project/staticfiles/;
    }

    # Путь к медиафайлам (если пользователи загружают картинки)
    location /media/ {
        alias /home/app/django_project/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для долгих запросов (опционально)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}